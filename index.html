<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Gunny's Rabbit Hole</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#172033;--text:#f8fafc;--muted:#a8b3c7;--accent:#60a5fa;--line:#27344a}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#172554 0,#080b12 36%);color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:28px 18px 60px}
.hero{padding:38px 0 22px}.eyebrow{color:#93c5fd;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem}
h1{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.92;margin:10px 0 14px}.sub{max-width:760px;color:var(--muted);font-size:1.08rem;line-height:1.6}
.controls{position:sticky;top:0;z-index:5;background:rgba(8,11,18,.9);backdrop-filter:blur(12px);padding:14px 0;border-bottom:1px solid var(--line)}
input{width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:#0e1627;color:white;font-size:1rem;outline:none}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 2px}.filters button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#dbeafe;padding:9px 13px;border-radius:999px;font-weight:700}
.filters button.active{background:#2563eb;border-color:#2563eb;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding-top:22px}
.card{display:block;text-decoration:none;color:inherit;background:linear-gradient(145deg,var(--panel),#0c1322);border:1px solid var(--line);border-radius:18px;padding:18px;min-height:145px;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:#60a5fa}.num{color:#60a5fa;font-size:.78rem;font-weight:900}.card h2{font-size:1.12rem;margin:9px 0 8px}.card p{color:var(--muted);margin:0;line-height:1.45;font-size:.93rem}.tag{display:inline-block;margin-top:13px;color:#bfdbfe;background:#172554;padding:5px 8px;border-radius:8px;font-size:.72rem;font-weight:800}
footer{color:#718096;text-align:center;padding-top:38px;font-size:.85rem}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div class="eyebrow">Curiosity has no final destination</div><h1>Gunny's<br>Rabbit Hole</h1><p class="sub">A field guide to useful, strange, creative and endlessly explorable corners of the internet. Search it. Wander it. Lose an hour on purpose.</p></section>
<div class="controls"><input id="search" placeholder="Search the rabbit hole…" aria-label="Search"><div class="filters" id="filters"></div></div>
<main class="grid" id="grid"></main>
<footer>Built for curiosity • Gunny's Rabbit Hole</footer>
</div>
<script>
const sites=[
["12ft.io","Reader / access tool for cleaner article viewing.","Research"],["libgen.is","Search for books and academic materials; respect local copyright law.","Research"],["sci-hub.se","Academic-paper discovery; availability and legality vary by jurisdiction.","Research"],["alternativeto.net","Find alternatives to software and apps.","Tools"],["justwatch.com","Find where movies and shows are streaming.","Media"],["archive.org","Explore archived websites, books, audio, video and software.","Explore"],["gutenberg.org","Free public-domain classic books.","Research"],["pdfdrive.com","Search for PDF documents; verify rights before downloading.","Research"],["openculture.com","Free courses, lectures, books and cultural resources.","Learn"],["wolframalpha.com","Computational knowledge and math problem solving.","Learn"],["photopea.com","Browser-based image editor with Photoshop-like tools.","Create"],["squoosh.app","Compress and convert images in your browser.","Create"],["remove.bg","Automatically remove image backgrounds.","Create"],["cleanup.pictures","Remove unwanted objects from images.","Create"],["unscreen.com","Remove backgrounds from video clips.","Create"],["carbon.now.sh","Turn source code into polished images.","Developer"],["ray.so","Create stylish code screenshots.","Developer"],["shots.so","Create polished screenshots and mockups.","Create"],["smartmockups.com","Create product and device mockups.","Create"],["haveibeenpwned.com","Check whether an email appears in known data breaches.","Security"],["virustotal.com","Analyze suspicious files, hashes and URLs with multiple security engines.","Security"],["privnote.com","Send notes designed to disappear after reading.","Privacy"],["temp-mail.org","Temporary email addresses for low-stakes signups.","Privacy"],["file.io","Temporary file sharing with expiring links.","Tools"],["archive.ph","Create and view snapshots of public webpages.","Explore"],["similarsites.com","Discover websites similar to one you already like.","Explore"],["radio.garden","Spin the globe and listen to live radio worldwide.","Music"],["everynoise.com","Explore an enormous map of music genres.","Music"],["tunefind.com","Find songs heard in television and movies.","Music"],["musicforprogramming.net","Long-form music mixes built for concentration.","Music"],["mynoise.net","Customizable soundscapes for focus and relaxation.","Music"],["coffitivity.com","Ambient café sounds for working and focusing.","Music"],["elicit.com","AI-assisted research and literature review.","AI"],["consensus.app","Search scientific research with AI-assisted summaries.","AI"],["connectedpapers.com","Visual maps showing relationships among academic papers.","Research"],["semanticscholar.org","Academic search engine for scientific literature.","Research"],["scispace.com","Tools for finding and understanding research papers.","AI"],["summarize.tech","AI summaries of long YouTube videos.","AI"],["phind.com","AI search and assistance aimed at developers.","Developer"],["regex101.com","Build, test and explain regular expressions.","Developer"],["codebeautify.org","Format, validate and transform code and data.","Developer"],["jsonformatter.org","Format and inspect JSON data.","Developer"],["explainshell.com","Break down and explain shell commands.","Developer"],["raindrop.io","Visual bookmark and knowledge manager.","Tools"],["downdetector.com","See crowdsourced reports of service outages.","Tools"],["tineye.com","Reverse-image search engine.","Tools"],["fast.com","Quick internet speed test.","Tools"],["smallpdf.com","Online tools for common PDF tasks.","Tools"],["ilovepdf.com","Merge, split, compress and convert PDFs.","Tools"],["10minutemail.com","Short-lived temporary email address.","Privacy"]];
const grid=document.querySelector("#grid"), search=document.querySelector("#search"), filters=document.querySelector("#filters");
let category="All"; const cats=["All",...new Set(sites.map(s=>s[2]))];
cats.forEach(c=>{let b=document.createElement("button");b.textContent=c;b.className=c==="All"?"active":"";b.onclick=()=>{category=c;[...filters.children].forEach(x=>x.classList.toggle("active",x===b));render()};filters.appendChild(b)});
function render(){let q=search.value.toLowerCase().trim();grid.innerHTML="";sites.filter(s=>(category==="All"||s[2]===category)&&(!q||s.join(" ").toLowerCase().includes(q))).forEach((s,i)=>{let a=document.createElement("a");a.className="card";a.href="https://"+s[0];a.target="_blank";a.rel="noopener noreferrer";a.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span><h2>${s[0]} ↗</h2><p>${s[1]}</p><span class="tag">${s[2]}</span>`;grid.appendChild(a)})}
search.addEventListener("input",render);render();
</script></body></html>
